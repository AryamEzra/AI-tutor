[project]
name = "backend"
version = "0.1.0"
description = "Socratic Tutor FastAPI backend with Pinecone RAG"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.128.1",
    "uvicorn>=0.30.0",
    "pinecone[inference]>=5.0.1",
    "pypdf>=4.0.0",
    "python-multipart>=0.0.9",
    "groq>=0.4.0",
    "bcrypt>=4.1.0",
    "python-jose[cryptography]>=3.3.0",
]
